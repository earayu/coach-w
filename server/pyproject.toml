[project]
name = "coachw"
version = "0.0.1"
description = "coach-w server: realtime voice coach agent and token API"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.163.1",
    "livekit-agents==1.8.10",
    "livekit-api==1.2.2",
    "livekit-plugins-aliyun==1.8.10",
    "livekit-plugins-google==1.8.10",
    "livekit-plugins-openai==1.8.10",
    "livekit-plugins-silero==1.8.10",
    "livekit-plugins-xai==1.8.10",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coachw"]

[tool.uv]
# Keep LiveKit's transitive packages on the set verified end to end in voicelab (spec 7.1).
constraint-dependencies = [
    "livekit==1.1.21",
    "livekit-protocol==1.1.31",
    "livekit-local-inference==0.2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# model prompts are prose; wrapping them changes what the model reads
"src/coachw/agent/coach.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]
