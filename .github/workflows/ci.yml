name: CI
# Prose and spikes never affect the checks below.
# Keep the push and pull_request lists identical.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "spikes/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "spikes/**"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  coachkit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apple/CoachKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
