name: CI
# Prose and spikes never affect the checks below.
# Keep the push and pull_request lists identical.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "spikes/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "spikes/**"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/docker-compose.yml config --quiet
        env:
          COACHW_DOMAIN: coach.example.com
          NODE_IP: 203.0.113.10
          LIVEKIT_API_KEY: ci
          LIVEKIT_API_SECRET: ci-secret
      - run: docker build -t coachw-server:ci server
      - run: docker run --rm coachw-server:ci python -c "import coachw.api.app, coachw.agent.worker"
  coachkit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apple/CoachKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
  apps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: ./scripts/build-apple.sh
