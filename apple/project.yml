name: CoachW
options:
  bundleIdPrefix: com.earayu.coachw
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: PX6VJ5XLCG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSHealthShareUsageDescription: "coach-w reads your live workout metrics so the coach can follow your training."
    INFOPLIST_KEY_NSHealthUpdateUsageDescription: "coach-w saves workouts recorded on your Apple Watch to Health."

packages:
  CoachKit:
    path: CoachKit
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0

targets:
  CoachW:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    dependencies:
      - package: CoachKit
      - package: LiveKit
      - target: CoachWWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "coach-w uses the microphone so you can talk to your coach during a workout."
        NSLocalNetworkUsageDescription: "coach-w connects to a coach server on your local network during development."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: iOS/CoachW.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earayu.coachw
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: coach-w
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  CoachWWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    dependencies:
      - package: CoachKit
    info:
      path: Watch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKBackgroundModes:
          - workout-processing
        NSLocationWhenInUseUsageDescription: "coach-w records your route during outdoor workouts and saves it to Health with the workout."
    entitlements:
      path: Watch/CoachWWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earayu.coachw.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: coach-w
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.earayu.coachw
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  CoachW:
    build:
      targets:
        CoachW: all
        CoachWWatch: all
    run:
      config: Debug
  CoachWWatch:
    build:
      targets:
        CoachWWatch: all
    run:
      config: Debug
